# GIMS nginx vhost — install to /etc/nginx/sites-available/gips
server {
    listen 80;
    listen [::]:80;
    server_name __APP_HOST__;

    root /var/www/gips/public;
    index index.php;

    # DTR scans are capped at 10 MB by the app
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # never serve dotfiles (.env, .git, …)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    access_log /var/log/nginx/gips-access.log;
    error_log  /var/log/nginx/gips-error.log;
}
