; GIMS PHP-FPM pool.
; Loaded by the app image as /usr/local/etc/php-fpm.d/zz-gims.conf (loads last,
; so it overrides the base www.conf).

[www]
user = www-data
group = www-data

; Reachable only on the private Compose network; nginx is the only client.
listen = 9000

; Keep the container environment visible to the pool. docker-compose passes the
; production settings through env_file, and Laravel's Dotenv does not override
; real environment variables, so the container env must not be wiped here.
clear_env = no

pm = dynamic
; Size for a 2-4 vCPU / 4-8 GB VM. Each worker is ~40-60 MB with this app.
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers periodically to bound memory growth from long-lived processes.
pm.max_requests = 500

; Matches max_execution_time in php.ini.
request_terminate_timeout = 120s

; Surface worker crashes/warnings in `docker logs` instead of swallowing them.
catch_workers_output = yes
decorate_workers_output = no

; Access logs are useful while debugging but noisy over time; keep them on
; stderr so they land in the Docker log driver with the rest of the output.
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}dms %{kilo}MKB %C%%"

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M

; Never let a slow client keep a worker forever.
php_admin_value[max_execution_time] = 120
