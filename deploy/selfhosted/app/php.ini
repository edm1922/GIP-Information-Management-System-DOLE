; GIMS production PHP settings.
; Loaded by the app image as /usr/local/etc/php/conf.d/zz-gims.ini so it wins
; over the php.ini-production defaults that ship with the base image.

expose_php = Off

; Upload limits are driven by StoreInternDocumentRequest: the file rule allows
; 10 MB (max:10240 KB). Keep a little headroom over the validation limit; nginx
; client_max_body_size is 12m and post_max_size is 16M so the multipart
; envelope always fits.
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 20
memory_limit = 256M

; Reports/CSV exports are generated synchronously and can take a while.
max_execution_time = 120
max_input_time = 120

; Never render errors to the client; production never has APP_DEBUG=true.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
; php-fpm forwards worker output to the container log (catch_workers_output=yes).
; Do not set error_log to a file: it would split logs away from `docker logs`.

; The application stores and interprets timestamps in UTC (config/app.php).
date.timezone = UTC

; Response buffering keeps nginx free while PHP finishes a request.
output_buffering = 4096
zlib.output_compression = Off

; Filesystem stat caching: the code is baked into the image, so a generous TTL
; is safe and cuts a syscall per autoloaded class. Deploys recreate containers.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: production settings. validate_timestamps=0 means code changes
; require a container restart (scripts/deploy.sh recreates app/queue/scheduler).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
; JIT is intentionally off: this workload is I/O bound (DB + files) and JIT
; makes opcache behaviour harder to reason about during incident response.
opcache.jit = off
opcache.jit_buffer_size = 0

; Session handling is owned by Laravel (database driver + its own cookies).
; The PHP session module is never used by the framework's session store here.
session.save_handler = files
session.gc_probability = 0
