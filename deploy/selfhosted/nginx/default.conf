# GIMS nginx site (internal origin for Cloudflare Tunnel).
#
# This server block listens on plain HTTP inside the private Compose network.
# TLS is terminated by Cloudflare, so HSTS is still correct for browsers but
# the origin itself never needs a certificate.

server_tokens off;

upstream php-fpm {
    server app:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # StoreInternDocumentRequest accepts files up to 10 MB; leave headroom for
    # the multipart envelope (PHP post_max_size is 16M).
    client_max_body_size 12m;

    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 120s;
    keepalive_timeout 30s;

    # Cloudflare Tunnel connects from the Docker bridge network (and from
    # loopback when the connector runs on the host). Trusting only private
    # ranges means a direct internet client cannot spoof CF-Connecting-IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Container/Compose health probe. Deliberately does not boot Laravel, so it
    # stays green while reporting an application-level failure separately.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Security headers. `always` keeps them on error responses too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Long-lived caching for fingerprinted/immutable assets only. Blade assets
    # are not fingerprinted, so keep the window short to avoid stale branding.
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Reject direct execution of anything that is not an existing PHP file.
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        # Mitigate the "httpoxy" class of vulnerabilities.
        fastcgi_param HTTP_PROXY "";

        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        # Reports/exports can run for a minute; keep above PHP's 120s limit.
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_connect_timeout 10s;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 32k;

        fastcgi_hide_header X-Powered-By;
        fastcgi_intercept_errors off;
    }

    # Never serve dotfiles (e.g. .git, .env if something is misplaced).
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
